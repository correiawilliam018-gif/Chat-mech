name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "ChatMeshDefinitivo.zip"
      - "build-apk-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -q ChatMeshDefinitivo.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted ChatMeshDefinitivo.zip build-apk-from-zip.yml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatMesh-debug
          path: app/build/outputs/apk/debug/app-debug.apk
